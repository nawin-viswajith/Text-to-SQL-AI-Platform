version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      MYSQL_USER: readonly_user
      MYSQL_PASSWORD: readonly_password
      MYSQL_DATABASE: analytics
      DOCS_TOKEN: change-me
      API_TOKEN: change-me-api-token
      CHROMA_PATH: /data/chroma
    volumes:
      - chroma-data:/data/chroma

  frontend:
    build:
      context: ./frontend
    ports:
      - "4173:4173"
    environment:
      VITE_API_BASE: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  chroma-data:

